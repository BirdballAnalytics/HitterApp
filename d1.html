  // ---- SDS: team-wide leaderboard, by pitch type, by location with nested zone box ----
  function hittingSubSDS(rows){
    if (sdsLeagueMean == null) {
      return `<div class="empty-msg">SDS hasn't been computed for this database yet -- run enrich_sds.py, then reload.</div>`;
    }
    const scored = rows.filter(r => r.sds != null);
    if (scored.length === 0) {
      return `<div class="empty-msg">No SDS-scored pitches for these filters yet.</div>`;
    }
    const byHitter = {};
    scored.forEach(r => {
      byHitter[r.batter_id] = byHitter[r.batter_id] || { name: r.batter, sum: 0, n: 0 };
      byHitter[r.batter_id].sum += r.sds; byHitter[r.batter_id].n++;
    });
    const leaderboard = Object.entries(byHitter).map(([id,s]) => {
      const mean = s.sum/s.n; const { plus, grade } = sdsPlusAndGrade(mean);
      return { name: s.name, pitches: s.n, mean, plus, grade };
    }).sort((a,b) => b.plus - a.plus);

    const byPitch = {};
    scored.forEach(r => {
      const d = pitchTypeDisplay(r.tagged_pitch_type);
      byPitch[d] = byPitch[d] || { sum: 0, n: 0 };
      byPitch[d].sum += r.sds; byPitch[d].n++;
    });
    const pitchOrder = ['Fastball','TwoSeam','Sinker','Cutter','ChangeUp','Splitter','Slider','Curveball','Sweeper','Other','Undefined','Knuckleball'];

    const zoneOrder = ['Heart','Shadow','Chase','Waste'];
    const byZone = {};
    scored.forEach(r => {
      if (!r.attack_zone) return;
      byZone[r.attack_zone] = byZone[r.attack_zone] || { sum: 0, n: 0, swings: 0, whiffs: 0 };
      byZone[r.attack_zone].sum += r.sds; byZone[r.attack_zone].n++;
      if (SWING_CODES.has(r.pitch_call||'')) byZone[r.attack_zone].swings++;
      if (r.pitch_call === 'SS') byZone[r.attack_zone].whiffs++;
    });
    const zoneColors = { Heart: '#4a9d5f', Shadow: '#e8843d', Chase: '#e8843d', Waste: '#d9453f' };

    return `
      <div class="section-label" style="margin-top:0;">Player Leaderboard</div>
      <div style="overflow-x:auto;"><table class="stat-table">
        <tr><th>Hitter</th><th>Pitches</th><th>Mean SDS</th><th>SDS+</th><th>Grade</th></tr>
        ${leaderboard.map(h => `<tr><td>${h.name}</td><td>${h.pitches}</td><td>${h.mean.toFixed(1)}</td><td>${h.plus}</td><td>${h.grade}</td></tr>`).join('')}
      </table></div>
      <div class="section-label">By Pitch Type — Team</div>
      <div style="overflow-x:auto;"><table class="stat-table">
        <tr><th>Pitch</th><th>Pitches</th><th>Mean SDS</th><th>SDS+</th></tr>
        ${pitchOrder.filter(p => byPitch[p]).map(p => {
          const s = byPitch[p]; const m = s.sum/s.n; const r = sdsPlusAndGrade(m);
          return `<tr><td>${p}</td><td>${s.n}</td><td>${m.toFixed(1)}</td><td>${r.plus}</td></tr>`;
        }).join('')}
      </table></div>
      <div class="section-label">By Location — Team</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">
        <svg viewBox="0 0 200 200" width="200" height="200" style="background:white;border:1px solid #eee;border-radius:6px;">
          <rect x="10" y="10" width="180" height="180" fill="${zoneColors.Waste}" opacity="0.5"/>
          <rect x="40" y="40" width="120" height="120" fill="${zoneColors.Chase}" opacity="0.7"/>
          <rect x="65" y="65" width="70" height="70" fill="${zoneColors.Shadow}" opacity="0.8"/>
          <rect x="85" y="85" width="30" height="30" fill="${zoneColors.Heart}"/>
          <text x="100" y="103" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Heart</text>
        </svg>
        <div style="overflow-x:auto;flex:1;min-width:280px;"><table class="stat-table">
          <tr><th>Zone</th><th>Pitches</th><th>Mean SDS</th><th>SDS+</th><th>Swing%</th><th>Whiff%</th></tr>
          ${zoneOrder.filter(z => byZone[z]).map(z => {
            const s = byZone[z]; const m = s.sum/s.n; const r = sdsPlusAndGrade(m);
            const swingPct = (s.swings/s.n*100).toFixed(1);
            const whiffPct = s.swings ? (s.whiffs/s.swings*100).toFixed(1) : '0.0';
            return `<tr><td>${z}</td><td>${s.n}</td><td>${m.toFixed(1)}</td><td>${r.plus}</td><td>${swingPct}%</td><td>${whiffPct}%</td></tr>`;
          }).join('')}
        </table></div>
      </div>`;
  }

  // ---- Sequences: NO REFERENCE SCREENSHOT was provided for this tab, so
  // this is explicitly a best-effort stand-in (same "approach by count"
  // concept used earlier in this project for individual hitters), not a
  // replica of anything actually seen. ----
  function hittingSubSequences(rows){
    const counts = {};
    rows.forEach(r => {
      if (r.balls == null || r.strikes == null) return;
      const key = `${r.balls}-${r.strikes}`;
      counts[key] = counts[key] || { total: 0, swings: 0, whiffs: 0 };
      counts[key].total++;
      if (SWING_CODES.has(r.pitch_call||'')) counts[key].swings++;
      if (r.pitch_call === 'SS') counts[key].whiffs++;
    });
    const order = ['0-0','1-0','0-1','2-0','1-1','0-2','3-0','2-1','1-2','3-1','2-2','3-2'];
    const present = order.filter(k => counts[k]);
    return `
      <div class="empty-msg" style="padding:10px 10px 20px;text-align:left;font-style:normal;">No reference screenshot was available for this tab, so this is a best-effort stand-in (approach-by-count), not a replica of a specific design.</div>
      <div style="overflow-x:auto;"><table class="stat-table">
        <tr><th>Count</th><th>Pitches</th><th>Swing%</th><th>Whiff% (of swings)</th></tr>
        ${present.map(k => {
          const c = counts[k];
          const swingPct = (c.swings/c.total*100).toFixed(1);
          const whiffPct = c.swings ? (c.whiffs/c.swings*100).toFixed(1) : '0.0';
          return `<tr><td>${k}</td><td>${c.total}</td><td>${swingPct}%</td><td>${whiffPct}%</td></tr>`;
        }).join('')}
      </table></div>`;
  }

  function hittingSubTraditionalStats(rows){
    const cols = [
      { label: 'Pitches', get: s => s.pitches },
      { label: 'PA', get: s => s.pa },
      { label: 'AB', get: s => s.ab },
      { label: 'H', get: s => s.hits },
      { label: '1B', get: s => s.singles },
      { label: '2B', get: s => s.doubles },
      { label: '3B', get: s => s.triples },
      { label: 'HR', get: s => s.hr },
      { label: 'TB', get: s => s.tb },
      { label: 'SO', get: s => s.strikeouts },
      { label: 'HBP', get: s => s.hbp },
      { label: 'BB', get: s => s.walks },
      { label: 'AVG', get: s => s.avg == null ? '-' : s.avg.toFixed(3) },
      { label: 'OBP', get: s => s.obp == null ? '-' : s.obp.toFixed(3) },
      { label: 'SLG', get: s => s.slg == null ? '-' : s.slg.toFixed(3) },
      { label: 'OPS', get: s => s.ops == null ? '-' : s.ops.toFixed(3) },
    ];
    const overall = { ...computeHittingStats(rows), pitches: rows.length };
    const vsR = { ...computeHittingStats(rows.filter(r => r.pitcher_throws === 'R')), pitches: rows.filter(r => r.pitcher_throws === 'R').length };
    const vsL = { ...computeHittingStats(rows.filter(r => r.pitcher_throws === 'L')), pitches: rows.filter(r => r.pitcher_throws === 'L').length };

    return `
      <div class="section-label" style="margin-top:0;">Overall</div>
      <div style="overflow-x:auto;">
      <table class="stat-table">
        <tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>
        <tr>${cols.map(c => `<td>${c.get(overall)}</td>`).join('')}</tr>
      </table>
      </div>
      <div class="section-label">By Pitcher Hand</div>
      <div style="overflow-x:auto;">
      <table class="stat-table">
        <tr><th>Side</th>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>
        <tr><td><b>Left</b></td>${cols.map(c => `<td>${c.get(vsL)}</td>`).join('')}</tr>
        <tr><td><b>Right</b></td>${cols.map(c => `<td>${c.get(vsR)}</td>`).join('')}</tr>
      </table>
      </div>`;
  }

  function hittingTeamSubRoster(rows){
    const byHitter = {};
    rows.forEach(r => {
      byHitter[r.batter_id] = byHitter[r.batter_id] || { name: r.batter, pitchesSeen: 0, inPlay: 0, sdsSum: 0, sdsN: 0 };
      byHitter[r.batter_id].pitchesSeen++;
      if (r.pitch_call === 'IP') byHitter[r.batter_id].inPlay++;
      if (r.sds != null) { byHitter[r.batter_id].sdsSum += r.sds; byHitter[r.batter_id].sdsN++; }
    });
    const sorted = Object.entries(byHitter).sort((a,b) => b[1].pitchesSeen - a[1].pitchesSeen);
    return `
      <div class="section-label" style="margin-top:0;">Hitters</div>
      <table class="stat-table">
        <tr><th>Hitter</th><th>Pitches Seen</th><th>Balls In Play</th><th>Mean SDS</th></tr>
        ${sorted.map(([id, s]) => `<tr class="clickable" data-id="${id}" data-name="${s.name}">
          <td>${s.name}</td><td>${s.pitchesSeen}</td><td>${s.inPlay}</td>
          <td>${s.sdsN ? (s.sdsSum/s.sdsN).toFixed(1) : '-'}</td>
        </tr>`).join('')}
      </table>
      <div class="status">Full SDS breakdown (by pitch type, by location) is available on each hitter's detail page.</div>`;
  }

  function hittingTeamSubOverview(rows){
    const slgHeat = weightedHeatmapSVG(rows, r => {
      if (r.pitch_call !== 'IP') return null;
      if (r.play_result === 'S') return 1;
      if (r.play_result === 'D') return 2;
      if (r.play_result === 'T') return 3;
      if (r.play_result === 'HR' || r.play_result === 'IPHR') return 4;
      return 0;
    }, {width:220,height:230});

    const evRows = rows.filter(r => r.pitch_call === 'IP' && r.exit_speed != null && r.exit_speed >= 95);
    const evHeat = evRows.length ? zoneHeatmapSVG(evRows, {width:220,height:230}) : '<div class="empty-msg" style="padding:40px 10px;font-size:12px;">No hard-hit (95+) balls recorded yet.</div>';

    const battedBallsByHitter = rows.filter(r => r.pitch_call === 'IP');
    const spray = sprayChartOrPlaceholder(battedBallsByHitter, {width:220,height:230});

    const overall = computeHittingStats(rows);
    const vsRHP = computeHittingStats(rows.filter(r => r.pitcher_throws === 'R'));
    const vsLHP = computeHittingStats(rows.filter(r => r.pitcher_throws === 'L'));
    const f3 = v => v==null ? '-' : (v===Infinity ? '∞' : v.toFixed(3));
    const f2 = v => v==null ? '-' : (v===Infinity ? '∞' : v.toFixed(2));
    const pct = v => v==null ? '-' : (v*100).toFixed(1)+'%';
    const runsAvail = overall.runsAvailable;

    const cols = [
      { label: 'Games', get: s => s.games },
      { label: 'PA', get: s => s.pa },
      { label: 'AB', get: s => s.ab },
      { label: 'Hits', get: s => s.hits },
      { label: '2B', get: s => s.doubles },
      { label: '3B', get: s => s.triples },
      { label: 'HR', get: s => s.hr },
      { label: 'AVG', get: s => f3(s.avg), rate: true },
      { label: 'OBP', get: s => f3(s.obp), rate: true },
      { label: 'SLG', get: s => f3(s.slg), rate: true },
      { label: 'OPS', get: s => f3(s.ops), rate: true },
      { label: 'ISO', get: s => f3(s.iso) },
      { label: 'wOBA', get: s => f3(s.woba), rate: true },
      { label: 'BABIP', get: s => f3(s.babip) },
      { label: 'K%', get: s => pct(s.kPct), rate: true },
      { label: 'BB%', get: s => pct(s.bbPct), rate: true },
      { label: 'K:BB', get: s => f2(s.kbb), rate: true },
      { label: 'R/G', get: s => runsAvail ? f2(s.runsPerGame) : 'N/A' },
    ];
    const splitRows = [
      { label: 'Overall', stats: overall },
      { label: 'vs RHP', stats: vsRHP },
      { label: 'vs LHP', stats: vsLHP },
    ];

    return `
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div class="chart-card"><div class="chart-card-header">Slugging</div><div class="chart-card-body">${slgHeat}</div></div>
        <div class="chart-card"><div class="chart-card-header">95+ Exit Velo</div><div class="chart-card-body">${evHeat}</div></div>
        <div class="chart-card"><div class="chart-card-header">Spray Chart (Balls In Play)</div><div class="chart-card-body">${spray}</div></div>
      </div>
      <div class="section-label">Team Hitting Stats</div>
      <div style="overflow-x:auto;">
      <table class="stat-table">
        <tr><th>Split</th>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>
        ${splitRows.map(sr => `<tr class="${sr.label==='Overall'?'row-total':''}"><td><b>${sr.label}</b></td>${cols.map(c => `<td class="${c.rate?'rate-stat':''}">${c.get(sr.stats)}</td>`).join('')}</tr>`).join('')}
      </table>
      </div>
      <div class="status">AB/OBP/BABIP use simplified denominators (sacrifice flies aren't broken out separately in this data). wOBA uses a standard-ish fixed weight set, not a recalculated season-specific one.${runsAvail ? '' : ' R/G shows "N/A" -- needs migration 010 + a fresh pull with the updated ingestion pipeline; already-ingested games will not have it retroactively.'}</div>`;
  }

  async function renderPitcherDetail(pitcherId, pitcherName){
    const content = document.getElementById('tabContent');
    // Replaces the team list entirely rather than stacking below it --
    // the team screen should genuinely go away while viewing one player.
    content.innerHTML = '';
    const detailDiv = document.createElement('div');
    detailDiv.className = 'pitcher-detail';
    detailDiv.innerHTML = `<div class="status">Loading ${pitcherName}...</div>`;
    content.appendChild(detailDiv);

    try {
      const url = `${apiBase()}/rest/v1/pitches?select=trackman_game_id,date,tagged_pitch_type,pitch_call,rel_speed,spin_rate,induced_vert_break,horz_break,plate_loc_side,plate_loc_height,attack_zone,rel_height,rel_side,extension,balls,strikes,batter_side,vert_appr_angle,horz_appr_angle,inning,top_bottom,pa_of_inning,kor_bb,play_result,outs_on_play,exit_speed,angle,direction,distance,bearing,contact_position_x,contact_position_y,contact_position_z,runs_scored&pitcher_id=eq.${encodeURIComponent(pitcherId)}${dateFilterQS()}&limit=3000`;
      const resp = await fetch(url, { headers: headers() });
      const rows = await resp.json();
      if (rows.length === 0) { detailDiv.innerHTML = `<div class="empty-msg">No detail rows found.</div>`; return; }
      const games = new Set(rows.map(r => r.trackman_game_id)).size;

      const subtabs = [
        { id: 'overview', label: 'Overview', render: pitchingTeamSubOverview },
        { id: 'results', label: 'Results', render: pitcherSubResults },
        { id: 'metrics', label: 'Metrics', render: pitcherSubMetrics },
        { id: 'locations', label: 'Locations', render: pitcherSubLocations },
        { id: 'heatmaps', label: 'Heat Maps', render: pitcherSubHeatmaps },
        { id: 'split', label: 'Results By Split', render: pitcherSubSplit },
        { id: 'release', label: 'Release/Extension', render: pitcherSubRelease },
        { id: 'countstrike', label: 'Strike% By Count', render: pitcherSubCountStrike },
        { id: 'izwhiff', label: 'IZ Whiff', render: pitcherSubIZWhiff },
        { id: 'pchase', label: 'Chase', render: pitcherSubChase },
        { id: 'velotime', label: 'Velo Over Time', render: pitcherSubVeloTime },
        { id: 'stroverTime', label: 'Strike% Over Time', render: pitcherSubStrikeTime },
        { id: 'flight3d', label: '3D Pitch Flight', render: pitcherSub3DFlightShell, postRender: pitcherSub3DFlightRender },
      ];
      let activeSub = 'overview';
      function renderShell(){
        detailDiv.innerHTML = `
          <span class="back-link" onclick="renderActiveTab()">&larr; Back to Team</span>
          <div class="section-label" style="margin-top:0;">${pitcherName} — ${rows.length} pitches / ${games} game(s)</div>
          <div class="subtabs-nav">
            ${subtabs.map(t => `<button class="subtab-btn ${t.id===activeSub?'active':''}" data-sub="${t.id}">${t.label}</button>`).join('')}
          </div>
          <div id="subtabContent"></div>`;
        detailDiv.querySelectorAll('.subtab-btn').forEach(btn => {
          btn.addEventListener('click', () => { activeSub = btn.dataset.sub; renderShell(); });
        });
        const activeDef = subtabs.find(t => t.id === activeSub);
        document.getElementById('subtabContent').innerHTML = activeDef.render(rows);
        // Plotly needs a real DOM element to render into, which doesn't
        // exist until the innerHTML assignment above completes -- so
        // any sub-tab that needs Plotly (or similar) sets postRender
        // instead of/in addition to embedding a static string.
        if (activeDef.postRender) activeDef.postRender(rows);
      }

      renderShell();
    } catch (e) {
      detailDiv.innerHTML = `<div class="empty-msg">${e.message}</div>`;
    }
  }

  function pitcherSubResults(rows){
    const total = rows.length;
    let balls=0, calledStrikes=0, swingingStrikes=0, fouls=0, inPlay=0, hbp=0;
    rows.forEach(r => {
      if (r.pitch_call === 'B') balls++;
      else if (r.pitch_call === 'SL') calledStrikes++;
      else if (r.pitch_call === 'SS') swingingStrikes++;
      else if (r.pitch_call === 'F') fouls++;
      else if (r.pitch_call === 'IP') inPlay++;
      else if (r.pitch_call === 'HBP') hbp++;
    });
    const swings = swingingStrikes + fouls + inPlay;
    const whiffPct = swings ? (swingingStrikes / swings * 100) : 0;
    const strikePct = (calledStrikes + swingingStrikes + fouls + inPlay) / total * 100;
    const byZone = { Heart: 0, Shadow: 0, Chase: 0, Waste: 0 };
    let zoneKnown = 0;
    rows.forEach(r => { if (r.attack_zone && byZone.hasOwnProperty(r.attack_zone)) { byZone[r.attack_zone]++; zoneKnown++; } });
    return `
      <table class="stat-table">
        <tr><th>Outcome</th><th>Count</th><th>%</th></tr>
        <tr><td>Ball</td><td>${balls}</td><td>${(balls/total*100).toFixed(1)}%</td></tr>
        <tr><td>Called Strike</td><td>${calledStrikes}</td><td>${(calledStrikes/total*100).toFixed(1)}%</td></tr>
        <tr><td>Swinging Strike</td><td>${swingingStrikes}</td><td>${(swingingStrikes/total*100).toFixed(1)}%</td></tr>
        <tr><td>Foul</td><td>${fouls}</td><td>${(fouls/total*100).toFixed(1)}%</td></tr>
        <tr><td>In Play</td><td>${inPlay}</td><td>${(inPlay/total*100).toFixed(1)}%</td></tr>
        <tr><td>HBP</td><td>${hbp}</td><td>${(hbp/total*100).toFixed(1)}%</td></tr>
        <tr><td><b>Strike%</b></td><td colspan="2">${strikePct.toFixed(1)}%</td></tr>
        <tr><td><b>Whiff% (of swings)</b></td><td colspan="2">${whiffPct.toFixed(1)}%</td></tr>
      </table>
      <div class="section-label">Location Summary (Heart / Shadow / Chase / Waste)</div>
      <table class="stat-table">
        <tr><th>Zone</th><th>Count</th><th>%</th></tr>
        ${Object.entries(byZone).map(([z,c]) => `<tr><td>${z}</td><td>${c}</td><td>${zoneKnown ? (c/zoneKnown*100).toFixed(1) : '0.0'}%</td></tr>`).join('')}
      </table>`;
  }

  function pitcherSubMetrics(rows){
    const total = rows.length;
    const byType = {};
    rows.forEach(r => {
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || {
        count:0, veloSum:0,veloN:0,veloMax:null, spinSum:0,spinN:0,spinMax:null,
        ivbSum:0,ivbN:0, hbSum:0,hbN:0, vaaSum:0,vaaN:0, haaSum:0,haaN:0
      };
      const s = byType[t];
      s.count++;
      if (r.rel_speed!=null){ s.veloSum+=r.rel_speed; s.veloN++; s.veloMax = s.veloMax==null ? r.rel_speed : Math.max(s.veloMax, r.rel_speed); }
      if (r.spin_rate!=null){ s.spinSum+=r.spin_rate; s.spinN++; s.spinMax = s.spinMax==null ? r.spin_rate : Math.max(s.spinMax, r.spin_rate); }
      if (r.induced_vert_break!=null){ s.ivbSum+=r.induced_vert_break; s.ivbN++; }
      if (r.horz_break!=null){ s.hbSum+=r.horz_break; s.hbN++; }
      if (r.vert_appr_angle!=null){ s.vaaSum+=r.vert_appr_angle; s.vaaN++; }
      if (r.horz_appr_angle!=null){ s.haaSum+=r.horz_appr_angle; s.haaN++; }
    });
    const mixRows = Object.entries(byType).sort((a,b)=>b[1].count-a[1].count);
    const moveRows = rows.filter(r => r.induced_vert_break!=null && r.horz_break!=null);
    const types = mixRows.map(([t])=>t);
    return `
      <table class="stat-table">
        <tr><th>Pitch Type</th><th>Count</th><th>%</th><th>Avg Velo</th><th>Max Velo</th><th>Avg Spin</th><th>Max Spin</th><th>IVB</th><th>HB</th><th>VAA</th><th>HAA</th></tr>
        ${mixRows.map(([type,s]) => `<tr>
          <td>${type}</td><td>${s.count}</td><td>${(s.count/total*100).toFixed(1)}%</td>
          <td>${s.veloN ? (s.veloSum/s.veloN).toFixed(1) : '-'}</td>
          <td>${s.veloMax!=null ? s.veloMax.toFixed(1) : '-'}</td>
          <td>${s.spinN ? Math.round(s.spinSum/s.spinN) : '-'}</td>
          <td>${s.spinMax!=null ? Math.round(s.spinMax) : '-'}</td>
          <td>${s.ivbN ? (s.ivbSum/s.ivbN).toFixed(1) : '-'}</td>
          <td>${s.hbN ? (s.hbSum/s.hbN).toFixed(1) : '-'}</td>
          <td>${s.vaaN ? (s.vaaSum/s.vaaN).toFixed(1) : '-'}</td>
          <td>${s.haaN ? (s.haaSum/s.haaN).toFixed(1) : '-'}</td>
        </tr>`).join('')}
      </table>
      <div class="section-label">Pitch Plot (movement: horizontal vs induced vertical break)</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
        <div>${moveRows.length ? axisScatterSVG(moveRows, {
          xField:'horz_break', yField:'induced_vert_break', xMin:-25, xMax:25, yMin:-25, yMax:25,
          xLabel:'Horizontal Break (in)', yLabel:'Induced Vertical Break (in)',
          colorFn: r => pitchColor(r.tagged_pitch_type), width:280, height:280
        }) : '<div class="empty-msg">No movement data.</div>'}</div>
        <div style="display:flex;flex-direction:column;gap:6px;padding-top:8px;">
          ${types.map(t => `<div style="display:flex;align-items:center;gap:6px;font-size:12px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${pitchColor(t)};display:inline-block;"></span>${t}
          </div>`).join('')}
        </div>
      </div>
      <div class="status">VAA/HAA are the pitch's approach angle at the plate (vertical/horizontal). Pitch plot axes are centered at 0,0 (a spinless, gravity-only pitch) -- same convention Baseball Savant's movement charts use.</div>`;
  }

  function pitcherSubLocations(rows){
    const byType = {};
    rows.forEach(r => { const t=r.tagged_pitch_type||'Unknown'; byType[t]=(byType[t]||0)+1; });
    const types = Object.keys(byType).sort((a,b)=>byType[b]-byType[a]);
    return `
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
        <div>${zoneScatterSVG(rows, {colorFn: r => pitchColor(r.tagged_pitch_type)})}</div>
        <div style="display:flex;flex-direction:column;gap:6px;padding-top:8px;">
          ${types.map(t => `<div style="display:flex;align-items:center;gap:6px;font-size:12px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${pitchColor(t)};display:inline-block;"></span>
            ${t} (${byType[t]})
          </div>`).join('')}
        </div>
      </div>`;
  }

  function pitcherSubHeatmaps(rows){
    const families = ['Fastball','Breaking','Offspeed'];
    const byFamily = {};
    families.forEach(f => byFamily[f] = rows.filter(r => pitchFamily(r.tagged_pitch_type) === f));
    return `
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        ${families.map(f => `
          <div style="width:200px;">
            <div style="font-size:12px;font-weight:700;text-align:center;margin-bottom:4px;">${f} (n=${byFamily[f].length})</div>
            ${byFamily[f].length ? zoneHeatmapSVG(byFamily[f], {width:200,height:210}) : '<div class="empty-msg" style="padding:60px 10px;">No pitches</div>'}
          </div>`).join('')}
      </div>
      <div class="status">Pitch families are grouped from tagged_pitch_type (Fastball: FA/FF/SI/FT/CT/FC, Breaking: SL/CU/CB/KC, Offspeed: CH/SP/FS) -- an approximation, since the API doesn't provide a pre-grouped family field.</div>`;
  }

  function pitcherSubSplit(rows){
    function outcomeBlock(sub, label){
      const total = sub.length;
      if (total === 0) return `<div class="empty-msg" style="padding:16px;">No pitches vs ${label}</div>`;
      let calledStrikes=0, swingingStrikes=0, fouls=0, inPlay=0, balls=0;
      sub.forEach(r => {
        if (r.pitch_call==='B') balls++;
        else if (r.pitch_call==='SL') calledStrikes++;
        else if (r.pitch_call==='SS') swingingStrikes++;
        else if (r.pitch_call==='F') fouls++;
        else if (r.pitch_call==='IP') inPlay++;
      });
      const strikePct = (calledStrikes+swingingStrikes+fouls+inPlay)/total*100;
      const swings = swingingStrikes+fouls+inPlay;
      const whiffPct = swings ? swingingStrikes/swings*100 : 0;
      return `
        <div style="flex:1;min-width:220px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">vs ${label} (n=${total})</div>
          <table class="stat-table">
            <tr><th>Metric</th><th>Value</th></tr>
            <tr><td>Strike%</td><td>${strikePct.toFixed(1)}%</td></tr>
            <tr><td>Whiff% (of swings)</td><td>${whiffPct.toFixed(1)}%</td></tr>
            <tr><td>Ball%</td><td>${(balls/total*100).toFixed(1)}%</td></tr>
            <tr><td>In Play%</td><td>${(inPlay/total*100).toFixed(1)}%</td></tr>
          </table>
        </div>`;
    }
    const vsL = rows.filter(r => r.batter_side === 'L');
    const vsR = rows.filter(r => r.batter_side === 'R');
    const unknown = rows.length - vsL.length - vsR.length;
    return `
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        ${outcomeBlock(vsL, 'LHH')}
        ${outcomeBlock(vsR, 'RHH')}
      </div>
      ${unknown ? `<div class="status">${unknown} pitch(es) have no recorded batter_side and aren't included in either split.</div>` : ''}`;
  }

  function pitcherSubRelease(rows){
    const byType = {};
    rows.forEach(r => {
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || { count:0, rhSum:0,rhN:0, rsSum:0,rsN:0, extSum:0,extN:0 };
      const s = byType[t];
      s.count++;
      if (r.rel_height!=null){ s.rhSum+=r.rel_height; s.rhN++; }
      if (r.rel_side!=null){ s.rsSum+=r.rel_side; s.rsN++; }
      if (r.extension!=null){ s.extSum+=r.extension; s.extN++; }
    });
    const typeRows = Object.entries(byType).sort((a,b)=>b[1].count-a[1].count);
    const releaseRows = rows.filter(r => r.rel_side!=null && r.rel_height!=null);
    return `
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
        <div>
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">Release Point (view: from behind the mound, looking toward home)</div>
          ${releaseRows.length ? axisScatterSVG(releaseRows, {
            xField:'rel_side', yField:'rel_height', xMin:4, xMax:-4, yMin:3, yMax:8,
            xLabel:'Release Side (ft)', yLabel:'Release Height (ft)',
            colorFn: r => pitchColor(r.tagged_pitch_type), width:260, height:240
          }) : '<div class="empty-msg">No release point data.</div>'}
        </div>
        <table class="stat-table" style="flex:1;min-width:280px;">
          <tr><th>Pitch Type</th><th>Count</th><th>Avg Rel Height</th><th>Avg Rel Side</th><th>Avg Extension</th></tr>
          ${typeRows.map(([type,s]) => `<tr>
            <td>${type}</td><td>${s.count}</td>
            <td>${s.rhN ? (s.rhSum/s.rhN).toFixed(2) : '-'}</td>
            <td>${s.rsN ? (s.rsSum/s.rsN).toFixed(2) : '-'}</td>
            <td>${s.extN ? (s.extSum/s.extN).toFixed(2) : '-'}</td>
          </tr>`).join('')}
        </table>
      </div>
      <div class="status">This view is mirrored from the plate-location charts elsewhere in this app (which show the catcher's-eye view) -- release side is flipped here to show what the pitcher themselves would see looking toward home plate.</div>`;
  }

  function pitcherSubCountStrike(rows){
    const counts = {};
    rows.forEach(r => {
      if (r.balls==null || r.strikes==null) return;
      const key = `${r.balls}-${r.strikes}`;
      counts[key] = counts[key] || { count:0, strikes:0 };
      counts[key].count++;
      if (SWING_CODES.has(r.pitch_call||'') || r.pitch_call==='SL') counts[key].strikes++;
    });
    const order = ['0-0','1-0','0-1','2-0','1-1','0-2','3-0','2-1','1-2','3-1','2-2','3-2'];
    const present = order.filter(k => counts[k]);
    return `
      <table class="stat-table">
        <tr><th>Count</th><th>Pitches</th><th>Strike%</th></tr>
        ${present.map(k => `<tr><td>${k}</td><td>${counts[k].count}</td><td>${(counts[k].strikes/counts[k].count*100).toFixed(1)}%</td></tr>`).join('')}
      </table>
      <div class="status">Strike% here counts called strikes, swinging strikes, fouls, and balls in play as strikes -- same definition used throughout this app's Strike% figures.</div>`;
  }

  function pitcherSubIZWhiff(rows){
    const whiffs = rows.filter(r => r.pitch_call === 'SS');
    return `
      <div class="section-label" style="margin-top:0;">Swinging Strikes Induced (n=${whiffs.length})</div>

  }

  function pitcherSubChase(rows){

    return `
      <div class="section-label" style="margin-top:0;">Chases Induced (batter swung, pitch outside the zone) — n=${chased.length}</div>
      ${chased.length ? zoneHeatmapSVG(chased, {width:260,height:280}) : '<div class="empty-msg">No chases induced.</div>'}`;

  function pitcherSubVeloTime(rows){
    const byType = {};
    rows.forEach(r => {
      if (r.date==null || r.rel_speed==null) return;
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || {};
      byType[t][r.date] = byType[t][r.date] || { sum:0, n:0 };
      byType[t][r.date].sum += r.rel_speed;
      byType[t][r.date].n++;
    });
    const types = Object.keys(byType).sort((a,b) => Object.values(byType[b]).reduce((s,d)=>s+d.n,0) - Object.values(byType[a]).reduce((s,d)=>s+d.n,0)).slice(0,4);
    const series = types.map(t => ({
      label: t, color: pitchColor(t),
      points: Object.entries(byType[t]).map(([date,d]) => ({x:date, y:d.sum/d.n})).sort((a,b)=>a.x.localeCompare(b.x))
    }));

          <span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block;"></span>${s.label}
        </span>`).join('')}
      </div>
      <div class="status">Top 4 most-thrown pitch types shown, one point per date (average velo that day).</div>`;
  }

  function pitcherSubStrikeTime(rows){
    const byDate = {};
    rows.forEach(r => {
      if (r.date==null) return;
      byDate[r.date] = byDate[r.date] || { count:0, strikes:0 };
      byDate[r.date].count++;
      if (SWING_CODES.has(r.pitch_call||'') || r.pitch_call==='SL') byDate[r.date].strikes++;
    });
    const points = Object.entries(byDate).map(([date,d]) => ({x:date, y:d.strikes/d.count*100})).sort((a,b)=>a.x.localeCompare(b.x));
    return lineChartSVG([{label:'Strike%', color:'#8C2232', points}], {width:580, height:220});
  }

  // ---- 3D Pitch Flight: release point through to plate crossing, per
  // pitch, colored by pitch type. Uses Plotly (loaded via CDN) since this
  // is genuine 3D that our SVG primitives aren't built for. Built only
  // from confirmed-available fields (release point, extension, plate
  // location) -- NOT the batted-ball spray/contact-point visualizations
  // the old app had, which need contact_position_x/y/z and bearing/
  // distance/direction fields the API doesn't provide. ----
  const MOUND_TO_PLATE_FT = 60.5;
  const GRAVITY_FTS2 = 32.174;

  // Real curved trajectory, not a straight line -- the point of this
  // whole chart. For constant acceleration (a reasonable approximation
  // for both gravity and Magnus force over a pitch's ~0.4s flight), the
  // deviation of the true curved path from the straight chord connecting
  // release to plate is a SYMMETRIC PARABOLA: zero at both endpoints,
  // peaking at the midpoint. That's not a stylistic choice -- it falls
  // directly out of position(t) = p0 + v0*t + 0.5*a*t² compared to the
  // linear chord between the same two endpoints. bulge(s) below encodes
  // exactly that shape; the peak magnitude is driven by real data
  // (flight time from velocity for gravity's contribution, induced
  // vertical/horizontal break for the Magnus contribution).
  //
  // This is an approximation, not a literal reconstruction -- we don't
  // have raw acceleration vectors the way Statcast's own public data
  // does (confirmed missing from this API back when the ingestion
  // pipeline was first built), so flight time is estimated from average
  // velocity rather than a true drag-inclusive integration. But the
  // curve shape itself, and the fact that it curves at all instead of
  // being a straight line, is physically correct.
  function curvedTrajectoryPoints(pitch, nSamples){
    const releaseY = -(MOUND_TO_PLATE_FT - pitch.extension);
    const plateX = approxPlateX(pitch.plate_loc_side);
    const plateZ = approxPlateZ(pitch.plate_loc_height);
    const releaseX = pitch.rel_side, releaseZ = pitch.rel_height;

    const distance = MOUND_TO_PLATE_FT - pitch.extension;
    const veloFtS = (pitch.rel_speed || 90) * 1.467;
    const flightTime = distance / veloFtS;

    const bulge = s => 4 * s * (1 - s); // 0 at s=0/1, peak of 1 at s=0.5

    const gravityPeak = 0.125 * GRAVITY_FTS2 * flightTime * flightTime; // ft, always pulls down
    const ivbFt = (pitch.induced_vert_break || 0) / 12;
    const hbFt = (pitch.horz_break || 0) / 12;
    // Positive induced vertical break (backspin "rise" relative to a
    // spinless pitch) partially counteracts gravity's downward bulge.
    const zBulgePeak = -gravityPeak + ivbFt * 0.5;
    const xBulgePeak = hbFt * 0.5;

    const xs = [], ys = [], zs = [];
    for (let i = 0; i <= nSamples; i++){
      const s = i / nSamples;
      const b = bulge(s);
      xs.push(releaseX + (plateX - releaseX) * s + xBulgePeak * b);
      ys.push(releaseY + (0 - releaseY) * s);
      zs.push(releaseZ + (plateZ - releaseZ) * s + zBulgePeak * b);
    }
    return { xs, ys, zs };
  }

  // Approximate real-feet conversion for the normalized plate location,
  // using the same half-width/half-height assumptions as this app's
  // other zone-based constants -- there's no way to get a truly exact
  // real-feet plate crossing point since we only have the normalized
  // value, so this is explicitly an approximation for visual purposes.
  function approxPlateX(normSide){ return normSide * 0.95; }
  function approxPlateZ(normHeight){ return 2.5 + normHeight * 1.0; }

  function pitcherSub3DFlightShell(rows){
    return `
      <div class="section-label" style="margin-top:0;">3D Pitch Flight (release point to plate crossing)</div>
      <div id="flight3dPlot" style="width:100%;height:500px;"></div>
      <div class="status">Trajectories are curved using real physics (gravity + the pitch's actual induced break, not a straight line) -- inspired by Baseball Savant's 3D Pitch Tracks visualization, though not a pixel-identical reconstruction: we don't have raw acceleration vectors the way Statcast's own data does, so flight time is estimated from average velocity rather than a full drag-inclusive simulation. Release point is real feet; plate crossing is converted from this app's normalized zone coordinates to an approximate real-feet position. The depth axis is compressed (not true 1:1 scale) so pitch-to-pitch differences stay visible. Capped at 200 pitches for readability; drag to rotate, scroll to zoom.</div>`;
  }

  function pitcherSub3DFlightRender(rows){
    if (typeof Plotly === 'undefined') {
      document.getElementById('flight3dPlot').innerHTML = '<div class="empty-msg">Plotly failed to load (check network/CDN access).</div>';
      return;
    }
    const usable = rows.filter(r => r.rel_side!=null && r.rel_height!=null && r.extension!=null && r.plate_loc_side!=null && r.plate_loc_height!=null);
    if (usable.length === 0) {
      document.getElementById('flight3dPlot').innerHTML = '<div class="empty-msg">No pitches with both release and plate location data.</div>';
      return;
    }
    const step = Math.max(1, Math.ceil(usable.length / 200));
    const sample = usable.filter((_, i) => i % step === 0);

    const byType = {};
    sample.forEach(r => {
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || { x: [], y: [], z: [] };
      const { xs, ys, zs } = curvedTrajectoryPoints(r, 14);
      byType[t].x.push(...xs, null);
      byType[t].y.push(...ys, null);
      byType[t].z.push(...zs, null);
    });

    const traces = Object.entries(byType).map(([type, d]) => ({
      type: 'scatter3d', mode: 'lines',
      x: d.x, y: d.y, z: d.z,
      line: { color: pitchColor(type), width: 3 },
      opacity: 0.55, name: type,
    }));

    // Strike zone reference box at the plate (y=0), for visual context
    traces.push({
      type: 'scatter3d', mode: 'lines',
      x: [-0.95, 0.95, 0.95, -0.95, -0.95], y: [0,0,0,0,0], z: [1.5, 1.5, 3.5, 3.5, 1.5],
      line: { color: '#444', width: 3 }, name: 'Strike Zone', showlegend: false,
    });

    // Ground plane and home plate, added after directly comparing this
    // chart against real Baseball Savant screenshots -- their view shows
    // an actual field/plate, not just floating trajectory lines. Plotly's
    // 3D scenes don't support a gradient sky/field background directly,
    // so the "field" is real geometry (a flat mesh at z=0) rather than a
    // background image.
    const groundPlane = {
      type: 'mesh3d',
      x: [-4, 4, 4, -4], y: [-58, -58, 4, 4], z: [0, 0, 0, 0],
      i: [0, 0], j: [1, 2], k: [2, 3],
      color: '#c9c4b6', opacity: 0.55, showscale: false, hoverinfo: 'skip', name: '',
    };
    // Home plate: same pentagon shape used for the 2D heat maps
    // elsewhere in this app, just in 3D now -- front edge (facing the
    // pitcher) at y=0 matching where plate-crossing points already sit,
    // tapering to a point toward the catcher.
    const plateZ = 0.02; // just above the ground plane, avoids z-fighting
    const homePlate = {
      type: 'mesh3d',
      x: [-0.708, -0.708, 0, 0.708, 0.708],
      y: [0, 0.35, 0.6, 0.35, 0],
      z: [plateZ, plateZ, plateZ, plateZ, plateZ],
      i: [0, 0, 0], j: [1, 2, 3], k: [2, 3, 4],
      color: 'white', opacity: 1, showscale: false, hoverinfo: 'skip', name: '',
    };
    traces.unshift(groundPlane, homePlate);

    const layout = {
      scene: {
        xaxis: { title: 'Side (ft)' },
        yaxis: { title: 'Depth from plate (ft, compressed)' },
        zaxis: { title: 'Height (ft)', range: [0, 8] },
        aspectmode: 'manual', aspectratio: { x: 1, y: 2, z: 1 },
        // Positioned behind/above home plate looking toward the mound --
        // a catcher's-eye-ish elevated view, matching the real Savant
        // screenshots. The previous version had this backwards (negative
        // y put the camera on the MOUND side looking at the plate).
        // Exact framing may need one more round of comparison against a
        // live screenshot of this chart specifically -- 3D camera
        // placement is inherently iterative and I can't render real
        // Plotly output myself to fine-tune it further right now.
        camera: { eye: { x: 0.25, y: 1.8, z: 0.9 } },
        bgcolor: '#3a3a38',
      },
      margin: { l: 0, r: 0, t: 10, b: 0 },
      legend: { x: 0, y: 1, font: { color: '#ccc' } },
      paper_bgcolor: '#3a3a38',
    };
    Plotly.newPlot('flight3dPlot', traces, layout, { responsive: true });
  }

  async function renderHitterDetail(batterId, batterName){
    const content = document.getElementById('tabContent');
    content.innerHTML = '';
    const detailDiv = document.createElement('div');
    detailDiv.className = 'pitcher-detail';
    detailDiv.innerHTML = `<div class="status">Loading ${batterName}...</div>`;
    content.appendChild(detailDiv);

    try {
      const url = `${apiBase()}/rest/v1/pitches?select=trackman_game_id,date,pitch_call,exit_speed,angle,plate_loc_side,plate_loc_height,attack_zone,balls,strikes,tagged_pitch_type,sds,inning,top_bottom,pa_of_inning,kor_bb,play_result,pitcher_throws,direction,distance,bearing,contact_position_x,contact_position_y,contact_position_z,runs_scored&batter_id=eq.${encodeURIComponent(batterId)}${dateFilterQS()}&limit=3000`;
      const resp = await fetch(url, { headers: headers() });
      const rows = await resp.json();
      if (rows.length === 0) { detailDiv.innerHTML = `<div class="empty-msg">No detail rows found.</div>`; return; }
      const games = new Set(rows.map(r => r.trackman_game_id)).size;

      const subtabs = [
        { id: 'overview', label: 'Overview', render: hittingTeamSubOverview },
        { id: 'outcomes', label: 'Outcomes', render: hitterSubOverview },
        { id: 'sds', label: 'SDS', render: hitterSubSDS },
        { id: 'exitvelo', label: 'Exit Velo', render: hitterSubExitVelo },
        { id: 'izwhiff', label: 'IZ Whiff', render: hitterSubIZWhiff },
        { id: 'chase', label: 'Chase', render: hitterSubChase },
        { id: 'evcharts', label: 'Exit Velo Charts', render: hitterSubEVCharts },
        { id: 'swingdec', label: 'Swing Decisions', render: hitterSubSwingDecisions },
        { id: 'takes', label: 'Takes', render: hitterSubTakes },
        { id: 'approach', label: 'Approach By Count', render: hitterSubApproachByCount },
      ];
      let activeSub = 'overview';
      function renderShell(){
        detailDiv.innerHTML = `
          <span class="back-link" onclick="renderActiveTab()">&larr; Back to Team</span>
          <div class="section-label" style="margin-top:0;">${batterName} — ${rows.length} pitches seen / ${games} game(s)</div>
          <div class="subtabs-nav">
            ${subtabs.map(t => `<button class="subtab-btn ${t.id===activeSub?'active':''}" data-sub="${t.id}">${t.label}</button>`).join('')}
          </div>
          <div id="subtabContent"></div>`;
        detailDiv.querySelectorAll('.subtab-btn').forEach(btn => {
          btn.addEventListener('click', () => { activeSub = btn.dataset.sub; renderShell(); });
        });
        document.getElementById('subtabContent').innerHTML = subtabs.find(t => t.id === activeSub).render(rows);
      }
      renderShell();
    } catch (e) {
      detailDiv.innerHTML = `<div class="empty-msg">${e.message}</div>`;
    }
  }

  function hitterSubOverview(rows){
    const total = rows.length;
    let balls=0, calledStrikes=0, swingingStrikes=0, fouls=0, inPlay=0, hbp=0;
    rows.forEach(r => {
      if (r.pitch_call === 'B') balls++;
      else if (r.pitch_call === 'SL') calledStrikes++;
      else if (r.pitch_call === 'SS') swingingStrikes++;
      else if (r.pitch_call === 'F') fouls++;
      else if (r.pitch_call === 'IP') inPlay++;
      else if (r.pitch_call === 'HBP') hbp++;
    });
    const swings = swingingStrikes + fouls + inPlay;
    const whiffPct = swings ? (swingingStrikes / swings * 100) : 0;
    const outsideZone = rows.filter(r => r.attack_zone === 'Chase' || r.attack_zone === 'Waste');
    const outsideSwung = outsideZone.filter(r => SWING_CODES.has(r.pitch_call || '')).length;
    const chasePct = outsideZone.length ? (outsideSwung / outsideZone.length * 100) : 0;
    return `
      <table class="stat-table">
        <tr><th>Outcome</th><th>Count</th><th>%</th></tr>
        <tr><td>Ball</td><td>${balls}</td><td>${(balls/total*100).toFixed(1)}%</td></tr>
        <tr><td>Called Strike</td><td>${calledStrikes}</td><td>${(calledStrikes/total*100).toFixed(1)}%</td></tr>
        <tr><td>Swinging Strike</td><td>${swingingStrikes}</td><td>${(swingingStrikes/total*100).toFixed(1)}%</td></tr>
        <tr><td>Foul</td><td>${fouls}</td><td>${(fouls/total*100).toFixed(1)}%</td></tr>
        <tr><td>In Play</td><td>${inPlay}</td><td>${(inPlay/total*100).toFixed(1)}%</td></tr>
        <tr><td>HBP</td><td>${hbp}</td><td>${(hbp/total*100).toFixed(1)}%</td></tr>
        <tr><td><b>Whiff% (of swings)</b></td><td colspan="2">${whiffPct.toFixed(1)}%</td></tr>
        <tr><td><b>Chase% (of pitches outside the zone)</b></td><td colspan="2">${chasePct.toFixed(1)}%</td></tr>
      </table>`;
  }

  function hitterSubSDS(rows){
    const scored = rows.filter(r => r.sds != null);
    if (scored.length === 0) {
      return `<div class="empty-msg">No SDS-scored pitches for this hitter yet -- run enrich_sds.py, then reload.</div>`;
    }
    const overall = scored.reduce((s,r) => s+r.sds, 0) / scored.length;
    const { plus, grade } = sdsPlusAndGrade(overall);

    const byType = {};
    scored.forEach(r => {
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || { sum:0, n:0 };
      byType[t].sum += r.sds; byType[t].n++;
    });
    const typeRows = Object.entries(byType).sort((a,b)=>b[1].n-a[1].n);

    const zoneOrder = ['Heart','Shadow','Chase','Waste'];
    const byZone = {};
    scored.forEach(r => {
      if (!r.attack_zone) return;
      byZone[r.attack_zone] = byZone[r.attack_zone] || { sum:0, n:0 };
      byZone[r.attack_zone].sum += r.sds; byZone[r.attack_zone].n++;
    });

    return `
      <table class="stat-table" style="max-width:400px;">
        <tr><th>Pitches</th><th>Mean SDS</th><th>SDS+</th><th>Grade</th></tr>
        <tr><td>${scored.length}</td><td>${overall.toFixed(1)}</td><td>${plus ?? '-'}</td><td>${grade ?? '-'}</td></tr>
      </table>
      <div class="section-label">By Pitch Type</div>
      <table class="stat-table">
        <tr><th>Pitch Type</th><th>Pitches</th><th>Mean SDS</th><th>SDS+</th></tr>
        ${typeRows.map(([type,s]) => {
          const m = s.sum/s.n; const r = sdsPlusAndGrade(m);
          return `<tr><td>${type}</td><td>${s.n}</td><td>${m.toFixed(1)}</td><td>${r.plus ?? '-'}</td></tr>`;
        }).join('')}
      </table>
      <div class="section-label">By Location (Heart / Shadow / Chase / Waste)</div>
      <table class="stat-table">
        <tr><th>Zone</th><th>Pitches</th><th>Mean SDS</th><th>SDS+</th></tr>
        ${zoneOrder.filter(z => byZone[z]).map(z => {
          const s = byZone[z]; const m = s.sum/s.n; const r = sdsPlusAndGrade(m);
          return `<tr><td>${z}</td><td>${s.n}</td><td>${m.toFixed(1)}</td><td>${r.plus ?? '-'}</td></tr>`;
        }).join('')}
      </table>
      <div class="status">SDS+ always compares against the fixed league-wide baseline (computed once by enrich_sds.py across the whole database), not just this team or whatever's currently filtered.</div>`;
  }

  function hitterSubExitVelo(rows){
    const inPlayRows = rows.filter(r => r.pitch_call === 'IP' && r.exit_speed != null);
    const avgEV = inPlayRows.length ? inPlayRows.reduce((s,r)=>s+r.exit_speed,0)/inPlayRows.length : null;
    const maxEV = inPlayRows.length ? Math.max(...inPlayRows.map(r=>r.exit_speed)) : null;
    const laRows = inPlayRows.filter(r=>r.angle!=null);
    const avgLA = laRows.length ? laRows.reduce((s,r)=>s+r.angle,0)/laRows.length : null;
    const hardHitPct = inPlayRows.length ? (inPlayRows.filter(r=>r.exit_speed>=95).length/inPlayRows.length*100) : null;
    const gb = laRows.filter(r=>r.angle<10).length;
    const ld = laRows.filter(r=>r.angle>=10 && r.angle<25).length;
    const fb = laRows.filter(r=>r.angle>=25 && r.angle<50).length;
    const pu = laRows.filter(r=>r.angle>=50).length;
    return `
      <table class="stat-table">
        <tr><th>Balls In Play</th><th>Avg EV</th><th>Max EV</th><th>Avg Launch Angle</th><th>Hard Hit%</th></tr>
        <tr>
          <td>${inPlayRows.length}</td>
          <td>${avgEV!=null?avgEV.toFixed(1):'-'}</td>
          <td>${maxEV!=null?maxEV.toFixed(1):'-'}</td>
          <td>${avgLA!=null?avgLA.toFixed(1):'-'}</td>
          <td>${hardHitPct!=null?hardHitPct.toFixed(1)+'%':'-'}</td>
        </tr>
      </table>
      <div class="section-label">Batted Ball Type (approximated from launch angle)</div>
      <table class="stat-table">
        <tr><th>Type</th><th>Angle Range</th><th>Count</th><th>%</th></tr>
        <tr><td>Ground Ball</td><td>&lt;10°</td><td>${gb}</td><td>${laRows.length?(gb/laRows.length*100).toFixed(1):'0.0'}%</td></tr>
        <tr><td>Line Drive</td><td>10-25°</td><td>${ld}</td><td>${laRows.length?(ld/laRows.length*100).toFixed(1):'0.0'}%</td></tr>
        <tr><td>Fly Ball</td><td>25-50°</td><td>${fb}</td><td>${laRows.length?(fb/laRows.length*100).toFixed(1):'0.0'}%</td></tr>
        <tr><td>Popup</td><td>&ge;50°</td><td>${pu}</td><td>${laRows.length?(pu/laRows.length*100).toFixed(1):'0.0'}%</td></tr>
      </table>
      <div class="status">Batted-ball type here is approximated from launch angle since the API doesn't provide a tagged hit-type field directly -- treat as directional, not exact.</div>`;
  }

  function hitterSubIZWhiff(rows){
    const whiffs = rows.filter(r => r.pitch_call === 'SS');
    return `
      <div class="section-label" style="margin-top:0;">Swinging Strike Locations (n=${whiffs.length})</div>
      ${whiffs.length ? zoneHeatmapSVG(whiffs, {width:260,height:280}) : '<div class="empty-msg">No swinging strikes recorded.</div>'}`;
  }

  function hitterSubChase(rows){
    const chased = rows.filter(r => (r.attack_zone === 'Chase' || r.attack_zone === 'Waste') && SWING_CODES.has(r.pitch_call||''));
    return `
      <div class="section-label" style="margin-top:0;">Chased Pitches (swung at, outside the zone) — n=${chased.length}</div>
      ${chased.length ? zoneHeatmapSVG(chased, {width:260,height:280}) : '<div class="empty-msg">No chased pitches recorded.</div>'}`;
  }

  function hitterSubEVCharts(rows){
    const inPlayRows = rows.filter(r => r.pitch_call === 'IP' && r.exit_speed != null && r.angle != null);
    return `
      <div class="section-label" style="margin-top:0;">Exit Velo vs Launch Angle (n=${inPlayRows.length})</div>
      ${inPlayRows.length ? axisScatterSVG(inPlayRows, {
        xField:'exit_speed', yField:'angle', xMin:50, xMax:115, yMin:-30, yMax:60,
        xLabel:'Exit Velo (mph)', yLabel:'Launch Angle (°)',
        colorFn: r => r.exit_speed >= 95 ? '#8C2232' : '#999', width:320, height:280
      }) : '<div class="empty-msg">No balls in play with both EV and launch angle recorded.</div>'}
      <div class="status">Dark red = hard-hit (95+ mph exit velo). No true spray/direction chart here -- the API doesn't provide batted-ball direction or distance, only exit velo and launch angle.</div>`;
  }

  function hitterSubSwingDecisions(rows){
    return `
      <div class="section-label" style="margin-top:0;">All Pitches Seen — Swing (maroon) vs Take (gray), n=${rows.length}</div>
      ${zoneScatterSVG(rows, {
        colorFn: r => SWING_CODES.has(r.pitch_call||'') ? '#8C2232' : '#999',
        width: 300, height: 300
      })}
      <div class="chip-legend" style="display:flex;gap:12px;margin-top:8px;">
        <span style="display:flex;align-items:center;gap:4px;font-size:12px;"><span style="width:10px;height:10px;border-radius:50%;background:#8C2232;display:inline-block;"></span>Swung</span>
        <span style="display:flex;align-items:center;gap:4px;font-size:12px;"><span style="width:10px;height:10px;border-radius:50%;background:#999;display:inline-block;"></span>Took</span>
      </div>`;
  }

  function hitterSubTakes(rows){
    const takes = rows.filter(r => r.pitch_call === 'B' || r.pitch_call === 'SL');
    const goodTakes = takes.filter(r => r.pitch_call === 'B').length;
    const badTakes = takes.filter(r => r.pitch_call === 'SL').length;
    return `
      <div class="section-label" style="margin-top:0;">Taken Pitches — Ball (green, good take) vs Called Strike (red, missed) — n=${takes.length}</div>
      ${takes.length ? zoneScatterSVG(takes, {
        colorFn: r => r.pitch_call === 'B' ? '#2a9d8f' : '#8C2232',
        width: 300, height: 300
      }) : '<div class="empty-msg">No taken pitches recorded.</div>'}
      <table class="stat-table" style="margin-top:10px;max-width:320px;">
        <tr><th>Take Type</th><th>Count</th><th>%</th></tr>
        <tr><td>Ball (good take)</td><td>${goodTakes}</td><td>${takes.length?(goodTakes/takes.length*100).toFixed(1):'0.0'}%</td></tr>
        <tr><td>Called Strike (missed)</td><td>${badTakes}</td><td>${takes.length?(badTakes/takes.length*100).toFixed(1):'0.0'}%</td></tr>
      </table>`;
  }

  // Labeled explicitly as this app's interpretation of "Sequences" -- a
  // pitch-by-pitch sequence replay isn't built yet, but swing/contact
  // discipline by count is a genuinely sequence-related view given what's
  // available, and a reasonable stand-in until true sequencing is built.
  function hitterSubApproachByCount(rows){
    const counts = {};
    rows.forEach(r => {
      if (r.balls==null || r.strikes==null) return;
      const key = `${r.balls}-${r.strikes}`;
      counts[key] = counts[key] || { total:0, swings:0, whiffs:0 };
      counts[key].total++;
      if (SWING_CODES.has(r.pitch_call||'')) counts[key].swings++;
      if (r.pitch_call === 'SS') counts[key].whiffs++;
    });
    const order = ['0-0','1-0','0-1','2-0','1-1','0-2','3-0','2-1','1-2','3-1','2-2','3-2'];
    const present = order.filter(k => counts[k]);
    return `
      <table class="stat-table">
        <tr><th>Count</th><th>Pitches</th><th>Swing%</th><th>Whiff% (of swings)</th></tr>
        ${present.map(k => {
          const c = counts[k];
          const swingPct = (c.swings/c.total*100).toFixed(1);
          const whiffPct = c.swings ? (c.whiffs/c.swings*100).toFixed(1) : '0.0';
          return `<tr><td>${k}</td><td>${c.total}</td><td>${swingPct}%</td><td>${whiffPct}%</td></tr>`;
        }).join('')}
      </table>
      <div class="status">This is an approach-by-count breakdown, not a true pitch-sequence replay (e.g. "what came after a first-pitch fastball") -- that's not built yet. Labeled here as the closest available stand-in for the old app's Sequences tab.</div>`;
  }

  function sdsPlusAndGrade(meanSds){
    if (meanSds == null || sdsLeagueMean == null || !sdsLeagueSd) return { plus: null, grade: null };
    const z = (meanSds - sdsLeagueMean) / sdsLeagueSd;
    return { plus: Math.round((100 + z*10) * 10) / 10, grade: Math.min(80, Math.max(20, Math.round(50 + z*10))) };
  }


  // ---- Hitting Lab ----
  // Trend and Batted Ball are fully achievable with confirmed-available
  // data. Space, Heat (Contact Point), and Spray depend on contact_position_x/y/z
  // and direction (ExitDir) -- newly requested via the ingestion pipeline's
  // `columns` parameter, but NOT YET VERIFIED against a live pull. Each of
  // those checks for real data at render time and shows a clear "pending"
  // message rather than a broken or empty-looking chart if it's not there yet.
  //
  // ---- Hitting Lab: BC-only, built on raw CSV exports (bc_hitting.json,
  // combining 2025SpringData.csv + 2026SpringData.csv), NOT the Supabase/
  // TruMedia pipeline the rest of this app uses. Confirmed those raw
  // exports have ~95% Distance/ExitSpeed coverage for BC's own batted
  // balls, vs. the ~6% we get through TruMedia for any team -- which is
  // exactly why this is BC-only for now rather than D1-wide like
  // everything else. If TruMedia's coverage ever improves, or if raw
  // exports become available for other teams, this could be widened.
  let hitlabRows = null;
  let hitlabActiveView = 'space';
  let hitlabActiveCamera = 'side';
  let hitlabSelectedSeason = null;
  let hitlabSelectedHitter = 'all';

  const HITLAB_VIEWS = [
    { id: 'space', label: 'Space' },
    { id: 'heat', label: 'Heat' },
    { id: 'spray', label: 'Spray' },
    { id: 'trend', label: 'Trend' },
    { id: 'battedball', label: 'Batted Ball' },
  ];
  const HITLAB_CAMERAS = [
    { id: 'catcher', label: 'Catcher', eye: {x: 0, y: -2.8, z: 0.6} },
    { id: 'pitcher', label: 'Pitcher', eye: {x: 0, y: 2.8, z: 0.6} },
    { id: 'side', label: 'Side', eye: {x: 2.6, y: 0.3, z: 0.7} },
    { id: 'overhead', label: 'Overhead', eye: {x: 0.01, y: 0.01, z: 3.2} },
  ];

  function hitlabEvColor(ev){
    if (ev == null) return '#888';
    const t = Math.max(0, Math.min(1, (ev - 65) / (108 - 65)));
    const stops = [[0,[34,85,204]],[0.3,[47,176,200]],[0.55,[87,194,90]],[0.78,[232,210,61]],[1,[217,69,63]]];
    for (let i=0;i<stops.length-1;i++){
      const [t0,c0]=stops[i], [t1,c1]=stops[i+1];
      if (t <= t1) {
        const f = (t-t0)/(t1-t0||1);
        const c = c0.map((v,j)=>Math.round(v+(c1[j]-v)*f));
        return `rgb(${c[0]},${c[1]},${c[2]})`;
      }
    }
    return 'rgb(217,69,63)';
  }

  // Real physics-based trajectory using each row's actual ExitSpeed/
  // Distance/Bearing/HangTime -- confirmed against a real recorded home
  // run (373 ft / 4.65s) to land at exactly the right distance with a
  // realistic ~88 ft apex, not an approximation shared across all rows.
  function hitlabTrajectory(row, nSamples=28){
    const T = row.HangTime;
    const dist = row.Distance;
    const bearingRad = (row.Bearing || 0) * Math.PI / 180;
    if (T == null || dist == null || T <= 0) return null;
    const g = 32.2;
    const h0 = 2.5;
    const v0 = (0.5*g*T*T - h0) / T;
    const pts = [];
    for (let i=0;i<=nSamples;i++){
      const t = (i/nSamples) * T;
      const frac = t / T;
      const x = dist * frac * Math.sin(bearingRad);
      const y = dist * frac * Math.cos(bearingRad);
      let z = h0 + v0*t - 0.5*g*t*t;
      if (z < 0) z = 0;
      pts.push({x, y, z});
    }
    return pts;
  }

  async function renderHittingLabTab(){
    const content = document.getElementById('tabContent');
    if (currentTeamName !== 'Boston College') {
      content.innerHTML = `<div class="empty-msg">Hitting Lab is BC-only for now -- it's built on Boston College's own raw TrackMan exports, which have far more complete batted-ball data (~95%) than what's available through the TruMedia pipeline for other teams (~6%). Switch to Boston College in the sidebar to use it.</div>`;
      return;
    }
    content.innerHTML = `<div class="hitlab-scope"><div class="hitlab-status">Loading BC hitting data...</div></div>`;
    try {
      if (hitlabRows === null) {
        const resp = await fetch('bc_hitting.json');
        if (!resp.ok) throw new Error(`Could not load bc_hitting.json (HTTP ${resp.status}) -- make sure it's committed alongside d1.html in the repo.`);
        hitlabRows = await resp.json();
      }
      const seasons = [...new Set(hitlabRows.map(r => (r.Date||'').slice(0,4)).filter(Boolean))].sort().reverse();
      if (hitlabSelectedSeason === null) hitlabSelectedSeason = seasons[0];
      const hitters = [...new Set(hitlabRows.map(r => r.Batter).filter(Boolean))].sort();

      content.innerHTML = `
        <div class="hitlab-scope">
          <div class="hitlab-toprow">
            <div class="hitlab-view-tabs" id="hitlabViewTabs">
              ${HITLAB_VIEWS.map(v => `<button class="${v.id===hitlabActiveView?'active':''}" data-view="${v.id}">${v.label}</button>`).join('')}
            </div>
            <div class="hitlab-filters">
              <label for="hitlabSeason">Season</label>
              <select id="hitlabSeason">${seasons.map(s => `<option value="${s}" ${s===hitlabSelectedSeason?'selected':''}>${s}</option>`).join('')}</select>
              <label for="hitlabHitter">Hitter</label>
              <select id="hitlabHitter"><option value="all">All BC Hitters</option>${hitters.map(h => `<option value="${h}" ${h===hitlabSelectedHitter?'selected':''}>${h}</option>`).join('')}</select>
            </div>
          </div>
          <div class="hitlab-cam-tabs" id="hitlabCamTabs">
            ${HITLAB_CAMERAS.map(c => `<button class="${c.id===hitlabActiveCamera?'active':''}" data-cam="${c.id}">${c.label}</button>`).join('')}
          </div>
          <div class="hitlab-status" id="hitlabStatus"></div>
          <div class="hitlab-panel"><div id="hitlabPlotArea" style="height:520px;"></div></div>
          <div class="hitlab-legend" id="hitlabLegend"></div>
        </div>`;

      document.getElementById('hitlabSeason').addEventListener('change', (e) => { hitlabSelectedSeason = e.target.value; hitlabRenderActiveView(); });
      document.getElementById('hitlabHitter').addEventListener('change', (e) => { hitlabSelectedHitter = e.target.value; hitlabRenderActiveView(); });
      document.querySelectorAll('#hitlabViewTabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          hitlabActiveView = btn.dataset.view;
          document.querySelectorAll('#hitlabViewTabs button').forEach(b => b.classList.toggle('active', b===btn));
          document.getElementById('hitlabCamTabs').style.display = hitlabActiveView === 'space' ? 'flex' : 'none';
          hitlabRenderActiveView();
        });
      });
      document.querySelectorAll('#hitlabCamTabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          hitlabActiveCamera = btn.dataset.cam;
          document.querySelectorAll('#hitlabCamTabs button').forEach(b => b.classList.toggle('active', b===btn));
          const cam = HITLAB_CAMERAS.find(c => c.id === hitlabActiveCamera);
          Plotly.relayout('hitlabPlotArea', { 'scene.camera.eye': cam.eye });
        });
      });
      hitlabRenderActiveView();
    } catch (e) {
      content.innerHTML = `<div class="hitlab-scope"><div class="hitlab-empty">${e.message}</div></div>`;
    }
  }

  function hitlabFilteredRows(){
    return hitlabRows.filter(r =>
      (r.Date||'').slice(0,4) === hitlabSelectedSeason &&
      (hitlabSelectedHitter === 'all' || r.Batter === hitlabSelectedHitter)
    );
  }

  function hitlabRenderActiveView(){
    if (hitlabActiveView === 'space') return hitlabRenderSpaceView();
    Plotly.purge('hitlabPlotArea');
    document.getElementById('hitlabLegend').innerHTML = '';
    document.getElementById('hitlabStatus').textContent = '';
    document.getElementById('hitlabPlotArea').innerHTML =
      `<div class="hitlab-empty">"${HITLAB_VIEWS.find(v=>v.id===hitlabActiveView).label}" is coming in a follow-up pass -- not built yet.</div>`;
  }

  function hitlabRenderSpaceView(){
    const rows = hitlabFilteredRows().filter(r => r.PitchCall === 'InPlay' && r.Distance != null && r.HangTime != null);
    document.getElementById('hitlabStatus').textContent = `showing ${rows.length} of ${rows.length} batted balls`;
    document.getElementById('hitlabLegend').innerHTML = `EV <div class="hitlab-grad"></div> 65-108 mph`;
    if (rows.length === 0) {
      Plotly.purge('hitlabPlotArea');
      document.getElementById('hitlabPlotArea').innerHTML = `<div class="hitlab-empty">No batted balls with full trajectory data for this selection.</div>`;
      return;
    }
    document.getElementById('hitlabPlotArea').innerHTML = '';
    const traces = [];
    rows.forEach(r => {
      const traj = hitlabTrajectory(r);
      if (!traj) return;
      const color = hitlabEvColor(r.ExitSpeed);
      traces.push({
        type: 'scatter3d', mode: 'lines', x: traj.map(p=>p.x), y: traj.map(p=>p.y), z: traj.map(p=>p.z),
        line: { color, width: 3 }, hoverinfo: 'skip', showlegend: false,
      });
      const last = traj[traj.length-1];
      traces.push({
        type: 'scatter3d', mode: 'markers', x: [last.x], y: [last.y], z: [last.z],
        marker: { color, size: 4 }, showlegend: false,
        hovertemplate: `<b>${r.PlayResult||'?'}</b><br>` +
          `Exit Velo: ${r.ExitSpeed?.toFixed(1) ?? '-'} mph<br>` +
          `Launch: ${r.Angle?.toFixed(1) ?? '-'}&deg;<br>` +
          `Distance: ${r.Distance?.toFixed(0) ?? '-'} ft<br>` +
          `Pitch: ${r.RelSpeed?.toFixed(1) ?? '-'} mph<br>` +
          `Movement: ${r.InducedVertBreak?.toFixed(1) ?? '-'}" IVB / ${r.HorzBreak?.toFixed(1) ?? '-'}" HB<br>` +
          `Count: ${r.Balls ?? '-'}-${r.Strikes ?? '-'}<br>` +
          `Date: ${r.Date || '-'}<extra></extra>`,
      });
    });
    traces.push({
      type: 'scatter3d', mode: 'markers', x: [0], y: [0], z: [0],
      marker: { color: 'white', size: 5, symbol: 'diamond' }, hoverinfo: 'skip', showlegend: false,
    });
    const cam = HITLAB_CAMERAS.find(c => c.id === hitlabActiveCamera);
    Plotly.newPlot('hitlabPlotArea', traces, {
      paper_bgcolor: '#12161f', plot_bgcolor: '#12161f', font: { color: '#e8eaf0' }, margin: {l:0,r:0,t:10,b:0},
      scene: {
        xaxis: { title: '', showbackground: false, gridcolor: '#262d3d', zerolinecolor: '#3a4256' },
        yaxis: { title: '', showbackground: false, gridcolor: '#262d3d', zerolinecolor: '#3a4256' },
        zaxis: { title: '', showbackground: false, gridcolor: '#262d3d', zerolinecolor: '#3a4256', range: [0, 120] },
        camera: { eye: cam.eye },
        aspectmode: 'data',
      },
    }, { displayModeBar: false, responsive: true });
  }
</script>
</body>
</html>
