  // ---- STRIKE% BY COUNT ----
  function pitchingSubStrikeByCount(rows){
    const order = ['0-1','1-0','1-1','0-2','1-2','2-2','2-0','2-1','3-0','3-1','3-2'];
    function strikePctByCount(arr){
      const out = {};
      order.forEach(k => {
        const [b,s] = k.split('-').map(Number);
        const cRows = arr.filter(r => r.balls===b && r.strikes===s);
        if (cRows.length === 0) { out[k] = '-'; return; }
        const strikes = cRows.filter(r => SWING_CODES.has(r.pitch_call||'') || r.pitch_call==='SL').length;
        out[k] = (strikes/cRows.length*100).toFixed(1)+'%';
      });
      return out;
    }
    const overall = strikePctByCount(rows);
    const byType = groupByPitchType(rows);
    return `
      <div class="section-label" style="margin-top:0;">Overall</div>
      <div style="overflow-x:auto;"><table class="stat-table">
        <tr>${order.map(k=>`<th>${k}</th>`).join('')}</tr>
        <tr>${order.map(k=>`<td>${overall[k]}</td>`).join('')}</tr>
      </table></div>
      <div class="section-label">By Pitch</div>
      <div style="overflow-x:auto;"><table class="stat-table">
        <tr><th>Pitch</th>${order.map(k=>`<th>${k}</th>`).join('')}</tr>
        ${PITCH_ORDER.filter(p=>byType[p]).map(p => {
          const s = strikePctByCount(byType[p]);
          return `<tr><td>${p}</td>${order.map(k=>`<td>${s[k]}</td>`).join('')}</tr>`;
        }).join('')}
      </table></div>
      <div class="status">Strike% counts called strikes, swinging strikes, fouls, and balls in play as strikes -- same definition used throughout this app.</div>`;
  }

  // ---- VELO OVER TIME / STRIKE% OVER TIME ----
  // Pitch Number is this pitcher's own sequence, in chronological order,
  // NOT a raw pitch_no from the source data (which resets per game).
  function assignPitchSequence(rows){
    const sorted = [...rows].sort((a,b) => {
      if (a.date !== b.date) return (a.date||'').localeCompare(b.date||'');
      if (a.inning !== b.inning) return (a.inning||0) - (b.inning||0);
      if (a.pa_of_inning !== b.pa_of_inning) return (a.pa_of_inning||0) - (b.pa_of_inning||0);
      return 0;
    });
    return sorted.map((r,i) => ({ ...r, _seq: i+1 }));
  }
  function pitchingSubVeloOverTime(rows){
    const seq = assignPitchSequence(rows.filter(r => r.rel_speed!=null));
    const byType = groupByPitchType(seq);
    const maxByType = {};
    Object.entries(byType).forEach(([t,arr]) => { maxByType[t] = Math.max(...arr.map(r=>r.rel_speed)); });
    const withPct = seq.map(r => ({ ...r, _pctMax: r.rel_speed / maxByType[pitchTypeDisplay(r.tagged_pitch_type)] * 100 }));
    const chart = withPct.length ? axisScatterSVG(withPct, {
      xField:'_seq', yField:'_pctMax', xMin:0, xMax:Math.max(10,seq.length), yMin:50, yMax:100,
      xLabel:'Pitch Number', yLabel:'% of Max Velocity',
      colorFn: r => pitchColor(r.tagged_pitch_type), width:900, height:420,
    }) : '<div class="empty-msg">No velocity data.</div>';
    return `<div class="chart-card"><div class="chart-card-header">Percentage of Max Velocity</div><div class="chart-card-body">${chart}</div></div>`;
  }
  function pitchingSubStrikeOverTime(rows){
    const seq = assignPitchSequence(rows);
    const byType = {};
    seq.forEach(r => { const t = pitchTypeDisplay(r.tagged_pitch_type); byType[t] = byType[t]||[]; byType[t].push(r); });
    const withCum = [];
    Object.entries(byType).forEach(([t, arr]) => {
      let strikeCount = 0;
      arr.forEach((r,i) => {
        if (SWING_CODES.has(r.pitch_call||'') || r.pitch_call==='SL') strikeCount++;
        withCum.push({ ...r, _cumStrikePct: strikeCount/(i+1)*100 });
      });
    });
    const chart = withCum.length ? axisScatterSVG(withCum, {
      xField:'_seq', yField:'_cumStrikePct', xMin:0, xMax:Math.max(10,seq.length), yMin:0, yMax:100,
      xLabel:'Pitch Number', yLabel:'Strike %',
      colorFn: r => pitchColor(r.tagged_pitch_type), width:900, height:420,
    }) : '<div class="empty-msg">No pitch data.</div>';
    return `<div class="chart-card"><div class="chart-card-header">Cumulative Strike %</div><div class="chart-card-body">${chart}</div></div>`;
  }

  // ---- 3D Pitch Flight: release point through to plate crossing, per
  // pitch, colored by pitch type. Uses Plotly (loaded via CDN) since this
  // is genuine 3D that our SVG primitives aren't built for. Built only
  // from confirmed-available fields (release point, extension, plate
  // location) -- NOT the batted-ball spray/contact-point visualizations
  // the old app had, which need contact_position_x/y/z and bearing/
  // distance/direction fields the API doesn't provide. ----
  const MOUND_TO_PLATE_FT = 60.5;
  const GRAVITY_FTS2 = 32.174;

  // Real curved trajectory, not a straight line -- the point of this
  // whole chart. For constant acceleration (a reasonable approximation
  // for both gravity and Magnus force over a pitch's ~0.4s flight), the
  // deviation of the true curved path from the straight chord connecting
  // release to plate is a SYMMETRIC PARABOLA: zero at both endpoints,
  // peaking at the midpoint. That's not a stylistic choice -- it falls
  // directly out of position(t) = p0 + v0*t + 0.5*a*t² compared to the
  // linear chord between the same two endpoints. bulge(s) below encodes
  // exactly that shape; the peak magnitude is driven by real data
  // (flight time from velocity for gravity's contribution, induced
  // vertical/horizontal break for the Magnus contribution).
  //
  // This is an approximation, not a literal reconstruction -- we don't
  // have raw acceleration vectors the way Statcast's own public data
  // does (confirmed missing from this API back when the ingestion
  // pipeline was first built), so flight time is estimated from average
  // velocity rather than a true drag-inclusive integration. But the
  // curve shape itself, and the fact that it curves at all instead of
  // being a straight line, is physically correct.
  function curvedTrajectoryPoints(pitch, nSamples){
    const releaseY = -(MOUND_TO_PLATE_FT - pitch.extension);
    const plateX = approxPlateX(pitch.plate_loc_side);
    const plateZ = approxPlateZ(pitch.plate_loc_height);
    // Lefties were showing up releasing from the righty side -- mirroring
    // release side specifically for LHP fixes this. Plate crossing
    // (plate_loc_side) is a fixed, handedness-independent physical
    // position (which side of the plate the ball crosses, regardless of
    // who threw it) and does NOT get this same treatment.
    const releaseX = (pitch.pitcher_throws === 'L' ? -1 : 1) * pitch.rel_side, releaseZ = pitch.rel_height;

    const distance = MOUND_TO_PLATE_FT - pitch.extension;
    const veloFtS = (pitch.rel_speed || 90) * 1.467;
    const flightTime = distance / veloFtS;

    const bulge = s => 4 * s * (1 - s); // 0 at s=0/1, peak of 1 at s=0.5

    const gravityPeak = 0.125 * GRAVITY_FTS2 * flightTime * flightTime; // ft, always pulls down
    const ivbFt = (pitch.induced_vert_break || 0) / 12;
    const hbFt = (pitch.horz_break || 0) / 12;
    // Positive induced vertical break (backspin "rise" relative to a
    // spinless pitch) partially counteracts gravity's downward bulge.
    // Capped at a small, fixed, physically-realistic ceiling -- confirmed
    // via a real screenshot that this was being pushed well above the
    // release point for some pitches, which isn't physically possible no
    // matter how much backspin a pitch has. A first attempt at this
    // clamp scaled with the release-to-plate height gap, but testing
    // showed that actually made the clamp LOOSER for exactly the
    // pitches most prone to this (big drops), which is backwards --
    // a flat cap avoids that problem entirely.
    let zBulgePeak = -gravityPeak + ivbFt * 0.5;
    if (zBulgePeak > 0.6) zBulgePeak = 0.6;
    const xBulgePeak = hbFt * 0.5;

    const xs = [], ys = [], zs = [];
    for (let i = 0; i <= nSamples; i++){
      const s = i / nSamples;
      const b = bulge(s);
      xs.push(releaseX + (plateX - releaseX) * s + xBulgePeak * b);
      ys.push(releaseY + (0 - releaseY) * s);
      zs.push(releaseZ + (plateZ - releaseZ) * s + zBulgePeak * b);
    }
    return { xs, ys, zs };
  }

  // Approximate real-feet conversion for the normalized plate location,
  // using the same half-width/half-height assumptions as this app's
  // other zone-based constants -- there's no way to get a truly exact
  // real-feet plate crossing point since we only have the normalized
  // value, so this is explicitly an approximation for visual purposes.
  function approxPlateX(normSide){ return normSide * 0.95; }
  function approxPlateZ(normHeight){ return 2.5 + normHeight * 1.0; }

  function pitcherSub3DFlightShell(rows){
    return `
      <div class="section-label" style="margin-top:0;">3D Pitch Flight (release point to plate crossing)</div>
      <div id="flight3dPlot" style="width:100%;height:500px;"></div>
      <div class="status">Trajectories are curved using real physics (gravity + the pitch's actual induced break, not a straight line) -- inspired by Baseball Savant's 3D Pitch Tracks visualization, though not a pixel-identical reconstruction: we don't have raw acceleration vectors the way Statcast's own data does, so flight time is estimated from average velocity rather than a full drag-inclusive simulation. Release point is real feet; plate crossing is converted from this app's normalized zone coordinates to an approximate real-feet position. The depth axis is compressed (not true 1:1 scale) so pitch-to-pitch differences stay visible. Capped at 200 pitches for readability; drag to rotate, scroll to zoom.</div>`;
  }

  function pitcherSub3DFlightRender(rows){
    if (typeof Plotly === 'undefined') {
      document.getElementById('flight3dPlot').innerHTML = '<div class="empty-msg">Plotly failed to load (check network/CDN access).</div>';
      return;
    }
    const usable = rows.filter(r => r.rel_side!=null && r.rel_height!=null && r.extension!=null && r.plate_loc_side!=null && r.plate_loc_height!=null);
    if (usable.length === 0) {
      document.getElementById('flight3dPlot').innerHTML = '<div class="empty-msg">No pitches with both release and plate location data.</div>';
      return;
    }
    const step = Math.max(1, Math.ceil(usable.length / 200));
    const sample = usable.filter((_, i) => i % step === 0);

    const byType = {};
    sample.forEach(r => {
      const t = r.tagged_pitch_type || 'Unknown';
      byType[t] = byType[t] || { x: [], y: [], z: [] };
      const { xs, ys, zs } = curvedTrajectoryPoints(r, 14);
      byType[t].x.push(...xs, null);
      byType[t].y.push(...ys, null);
      byType[t].z.push(...zs, null);
    });

    const traces = Object.entries(byType).map(([type, d]) => ({
      type: 'scatter3d', mode: 'lines',
      x: d.x, y: d.y, z: d.z,
      line: { color: pitchColor(type), width: 3 },
      opacity: 0.55, name: type,
    }));

    // Strike zone reference box at the plate (y=0), for visual context
    traces.push({
      type: 'scatter3d', mode: 'lines',
      x: [-0.95, 0.95, 0.95, -0.95, -0.95], y: [0,0,0,0,0], z: [1.5, 1.5, 3.5, 3.5, 1.5],
      line: { color: '#444', width: 3 }, name: 'Strike Zone', showlegend: false,
    });

    // Ground plane and home plate, added after directly comparing this
    // chart against real Baseball Savant screenshots -- their view shows
    // an actual field/plate, not just floating trajectory lines. Plotly's
    // 3D scenes don't support a gradient sky/field background directly,
    // so the "field" is real geometry (a flat mesh at z=0) rather than a
    // background image.
    const groundPlane = {
      type: 'mesh3d',
      x: [-4, 4, 4, -4], y: [-58, -58, 4, 4], z: [0, 0, 0, 0],
      i: [0, 0], j: [1, 2], k: [2, 3],
      color: '#c9c4b6', opacity: 0.55, showscale: false, hoverinfo: 'skip', name: '',
    };
    // Home plate: same pentagon shape used for the 2D heat maps
    // elsewhere in this app, just in 3D now -- front edge (facing the
    // pitcher) at y=0 matching where plate-crossing points already sit,
    // tapering to a point toward the catcher.
    const plateZ = 0.02; // just above the ground plane, avoids z-fighting
    const homePlate = {
      type: 'mesh3d',
      x: [-0.708, -0.708, 0, 0.708, 0.708],
      y: [0, 0.35, 0.6, 0.35, 0],
      z: [plateZ, plateZ, plateZ, plateZ, plateZ],
      i: [0, 0, 0], j: [1, 2, 3], k: [2, 3, 4],
      color: 'white', opacity: 1, showscale: false, hoverinfo: 'skip', name: '',
    };
    traces.unshift(groundPlane, homePlate);

    const layout = {
      scene: {
        xaxis: { title: 'Side (ft)' },
        yaxis: { title: 'Depth from plate (ft, compressed)' },
        zaxis: { title: 'Height (ft)', range: [0, 8] },
        aspectmode: 'manual', aspectratio: { x: 1, y: 2, z: 1 },
        // Positioned behind/above home plate looking toward the mound --
        // a catcher's-eye-ish elevated view, matching the real Savant
        // screenshots. The previous version had this backwards (negative
        // y put the camera on the MOUND side looking at the plate).
        // Exact framing may need one more round of comparison against a
        // live screenshot of this chart specifically -- 3D camera
        // placement is inherently iterative and I can't render real
        // Plotly output myself to fine-tune it further right now.
        // Raised substantially and pulled back further from the plate --
        // the previous z=0.9 (roughly shin height) put the camera BELOW
        // most of the actual pitch trajectory, looking up and away
        // toward the mound. A real screenshot showed this reading as
        // disorienting/"upside down": the natural mental model is
        // release-high-and-far, plate-lower-and-near, and a too-low
        // camera inverts that sense. This targets roughly catcher/
        // umpire eye level looking out, matching real broadcast framing.
        camera: { eye: { x: 0.3, y: 2.6, z: 4.2 }, up: { x: 0, y: 0, z: 1 } },
        bgcolor: '#3a3a38',
      },
      margin: { l: 0, r: 0, t: 10, b: 0 },
      legend: { x: 0, y: 1, font: { color: '#ccc' } },
      paper_bgcolor: '#3a3a38',
    };
    Plotly.newPlot('flight3dPlot', traces, layout, { responsive: true });
  }

  function sdsPlusAndGrade(meanSds){
    if (meanSds == null || sdsLeagueMean == null || !sdsLeagueSd) return { plus: null, grade: null };
    const z = (meanSds - sdsLeagueMean) / sdsLeagueSd;
    return { plus: Math.round((100 + z*10) * 10) / 10, grade: Math.min(80, Math.max(20, Math.round(50 + z*10))) };
  }


</script>
