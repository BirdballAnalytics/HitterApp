<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boston College Baseball</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script>
<style>
  :root{
    --maroon:#8C2232;
    --maroon-dark:#6b1a26;
    --gold:#DBCCA6;
    --cream:#ede1d2;
    --dark-bg:#0d1117;
    --panel-bg:#111820;
    --ink:#1a1a1a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#f7f6f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,Roboto,Arial,sans-serif;}
  a{color:inherit;}

  /* ── Header ── */
  .header-bar{
    background:var(--maroon);
    padding:10px 22px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--gold);
    position:sticky;top:0;z-index:50;
  }
  .header-bar .brand{display:flex;align-items:center;gap:12px;}
  .header-bar .brand .crest{
    width:42px;height:42px;
    display:block;
    background:#fff;
    border-radius:8px;
    padding:4px;
  }
  .header-bar h1{
    color:var(--gold);font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    margin:0;font-weight:800;
  }

  /* ── Layout ── */
  .layout{display:flex;min-height:calc(100vh - 62px);}
  .sidebar{
    width:290px;flex:0 0 290px;
    background:var(--maroon);color:var(--gold);
    padding:20px 18px;border-right:3px solid var(--gold);
  }
  .sidebar label{
    display:block;color:var(--gold);font-weight:700;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:16px;
  }
  .sidebar label:first-of-type{margin-top:0;}
  .sidebar select, .sidebar input[type=date]{
    width:100%;background:rgba(255,255,255,.1);border:1px solid var(--gold);
    color:#fff;border-radius:4px;padding:6px 8px;font-size:12.5px;font-family:inherit;
  }
  .sidebar select[multiple]{height:120px;}
  .sidebar option{color:#111;}
  .sidebar-divider{border-top:1px solid rgba(219,204,166,.3);margin:16px 0 0 0;}
  .date-range-row{display:flex;gap:6px;}
  .date-range-row input{width:50%;}
  #hitterCount{font-size:10.5px;color:rgba(219,204,166,.7);margin-top:4px;}

  .main{flex:1;min-width:0;padding:0 22px 40px 22px;}

  /* ── Tabs ── */
  .tabs-nav{
    display:flex;flex-wrap:wrap;gap:2px;border-bottom:2px solid #e4e0d8;
    margin-top:16px;position:sticky;top:62px;background:#f7f6f3;z-index:40;padding-top:4px;
  }
  .tab-btn{
    background:none;border:none;cursor:pointer;
    padding:9px 14px;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    color:#666;text-transform:uppercase;border-bottom:3px solid transparent;
    font-family:inherit;
  }
  .tab-btn:hover{color:var(--maroon);}
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--maroon);}
  .tab-panel{display:none;padding-top:16px;}
  .tab-panel.active{display:block;}

  .section-label{
    font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:#666;margin:20px 0 8px 0;padding-bottom:5px;border-bottom:2px solid #eee;
  }
  .section-label:first-child{margin-top:0;}
  .chart-row{margin-top:14px;}
  .grid{display:grid;gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:1100px){.grid-3{grid-template-columns:1fr 1fr;}.grid-4{grid-template-columns:1fr 1fr;}}
  .chart-box{background:#fff;border:1px solid #eae6dd;border-radius:6px;padding:6px;}
  .chart-title{font-size:11px;font-weight:700;text-align:center;color:#333;padding:6px 0 0 0;}

  /* -- Scout report layout -- */
  .scout-header-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .scout-top-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start;}
  .scout-heat-grid .chart-box{padding:3px;}
  @media (max-width:900px){.scout-top-grid{grid-template-columns:1fr;}}

  /* ── Tables ── */
  table.stat-table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;margin-bottom:6px;}
  table.stat-table th{
    background:var(--maroon);color:var(--gold);font-size:11px;font-weight:700;
    padding:7px 9px;text-align:center;white-space:nowrap;cursor:pointer;user-select:none;
  }
  table.stat-table th:hover{background:var(--maroon-dark);}
  table.stat-table td{padding:6px 9px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap;}
  table.stat-table tr:nth-child(even) td{background:#faf9f6;}
  table.stat-table tr:hover td{background:#f1ece2;}
  .rate-cell{font-weight:700;}
  .pct-cell{font-weight:700;color:var(--maroon);}
  .table-scroll{overflow-x:auto;}

  /* ── Spray tab ── */
  #spray-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 4px 10px 4px;border-bottom:1px solid #e0e0e0;margin-bottom:6px;}
  .spray-btn{background:#f5f5f5;color:#333;border:1px solid #ccc;border-radius:4px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit;}
  .spray-btn.active{background:var(--maroon);color:var(--gold);border-color:var(--maroon);}
  .spray-btn:hover:not(.active){background:#e8e8e8;}
  .spray-btn-divider{width:1px;height:26px;background:#ddd;margin:0 4px;}
  #spray_ev_bar{display:flex;align-items:center;gap:8px;font-size:11px;color:#555;}
  #spray_ev_gradient{width:140px;height:10px;border-radius:5px;background:linear-gradient(to right,#1a237e,#0288d1,#00e676,#ffeb3b,#b71c1c);}
  #spray_stat_card{
    position:absolute;top:56px;left:10px;background:rgba(15,20,30,.93);color:#e0e8f0;
    border-radius:6px;padding:10px 14px;font-size:12px;line-height:1.8;min-width:200px;
    pointer-events:none;z-index:20;display:none;
  }
  #spray_stat_card .card-result{font-size:15px;font-weight:800;letter-spacing:.06em;margin-bottom:6px;}
  #spray_stat_card .card-row{display:flex;justify-content:space-between;gap:20px;}
  #spray_stat_card .card-label{color:#7a9ab0;font-size:10px;text-transform:uppercase;}
  #spray_stat_card .card-value{font-weight:700;text-align:right;}

  /* ── Contact tab ── */
  #contact-panel{background:var(--dark-bg);border-radius:8px;padding:12px 16px 0 16px;margin-bottom:8px;}
  .contact-btn-row{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
  .contact-btn{background:#1e2530;color:#b0b8c8;border:1px solid #2e3a4a;border-radius:4px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;cursor:pointer;text-transform:uppercase;font-family:inherit;}
  .contact-btn.active,.contact-btn:hover{background:var(--maroon);color:var(--gold);border-color:var(--maroon);}
  .contact-btn-divider{width:1px;background:#2e3a4a;margin:0 6px;align-self:stretch;}
  #contact_subtitle{color:#8a96a8;font-size:11px;text-align:center;margin:2px 0 6px 0;letter-spacing:.04em;}
  #contact_n_label{color:#8a96a8;font-size:10px;text-align:right;padding-right:4px;}

  .empty-msg{color:#888;font-size:13px;padding:30px;text-align:center;}
  .loading{padding:60px;text-align:center;color:#888;font-size:14px;}

  /* -- Landing screen -- */
  #landingScreen{
    min-height:calc(100vh - 62px);
    background:linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:40px 20px;
  }
  #landingScreen .landing-title{
    color:var(--gold);font-size:15px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:700;opacity:.85;
  }
  .mode-tiles{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;}
  .mode-tile{
    width:220px;height:220px;border-radius:14px;
    background:rgba(255,255,255,.06);border:2px solid var(--gold);
    color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;cursor:pointer;font-family:inherit;
    font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    transition:background .15s, transform .15s;
  }
  .mode-tile:hover{background:var(--gold);color:var(--maroon);transform:translateY(-3px);}
  .mode-tile svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:1.6;}

  /* -- Back to selection link -- */
  #backToLanding{
    display:block;color:var(--gold);font-weight:700;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;text-decoration:none;margin-top:24px;opacity:.8;cursor:pointer;
  }
  #backToLanding:hover{opacity:1;text-decoration:underline;}

  /* -- One-page PDF export (File > Print / "Download PDF" button) -- */
  @page{ size: letter; margin: 0.35in; }
  @media print{
    @page{ size: letter landscape; margin: 0.3in; }
    body{ background:#fff; }
    .header-bar, .sidebar, .tabs-nav, #landingScreen, .no-print{ display:none !important; }
    .layout, .main{ padding:0; margin:0; min-height:0; }
    .main{ padding:0 !important; }
    #tabsContent{ margin:0; }
    .tab-panel{ display:none !important; }
    .tab-panel.active{ display:block !important; }
    .section-label{ font-size:9px; margin:6px 0 4px 0; padding-bottom:2px; }
    table.stat-table{ font-size:7px; }
    table.stat-table th, table.stat-table td{ padding:2px 4px; }
    .scout-top-grid{ grid-template-columns:1.3fr 1fr; gap:8px; }
    .scout-heat-grid{ gap:4px; }
    .chart-box{ border:1px solid #ddd; padding:2px; break-inside:avoid; }
    .grid{ gap:4px; }
  }
</style>
</head>
<body>

<div class="header-bar">
  <div class="brand">
    <img class="crest" src="__LOGO_URI__" alt="Boston College Eagles">
    <div>
      <h1>Boston College Baseball</h1>
    </div>
  </div>
</div>

<div id="landingScreen">
  <div class="landing-title">Select a view</div>
  <div class="mode-tiles">
    <button class="mode-tile" id="tileHitting" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 20 L20 4 M14 4 h6 v6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="2.4"/></svg>
      Hitting
    </button>
    <button class="mode-tile" id="tilePitching" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M4.5 8.5 Q12 12 19.5 8.5 M4.5 15.5 Q12 12 19.5 15.5" stroke-linecap="round"/></svg>
      Pitching
    </button>
    <button class="mode-tile" id="tileScout" type="button">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16 L21 21" stroke-linecap="round"/></svg>
      Scout
    </button>
  </div>
</div>

<div class="layout" id="appScreen" style="display:none;">
  <div class="sidebar">
    <label for="seasonInput">Season</label>
    <select id="seasonInput"></select>

    <div class="sidebar-divider"></div>
    <label>Date Range</label>
    <div class="date-range-row">
      <input type="date" id="dateStart">
      <input type="date" id="dateEnd">
    </div>

    <div class="sidebar-divider"></div>
    <label id="playerLabel" for="playerInput">Hitter</label>
    <select id="playerInput"></select>
    <div id="playerCount"></div>

    <div class="sidebar-divider"></div>
    <label for="gameInput">Game(s)</label>
    <select id="gameInput" multiple></select>

    <div class="sidebar-divider"></div>
    <a id="backToLanding">&larr; Back to Selection</a>
  </div>

  <div class="main">
    <div class="tabs-nav" id="tabsNav"></div>
    <div id="tabsContent"></div>
  </div>
</div>

<script id="data-blob" type="application/json">
__DATA_JSON__
</script>

<script>
__APP_JS__
</script>
</body>
</html>
