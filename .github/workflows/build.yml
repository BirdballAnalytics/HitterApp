name: Rebuild and publish hitter report

# Runs automatically whenever new/updated data is pushed, or the build logic
# itself changes. Also runnable by hand from the Actions tab.
"on":
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'template/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write   # to commit the rebuilt index.html back to the repo
  pages: write       # to publish to GitHub Pages
  id-token: write    # required by actions/deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build index.html from data/
        run: python scripts/build.py

      - name: Commit rebuilt site back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html — nothing to commit."
          else
            git commit -m "Auto-rebuild hitter report from updated data [skip ci]"
            git push
          fi

      # Package just the generated report (not the raw data/scripts) for Pages
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
